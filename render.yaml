# ─────────────────────────────────────────────────────────────────────────────
# Render Blueprint Specification — DPM-101 Helpdesk Chatbot
# Module 12: Production Deployment
# ─────────────────────────────────────────────────────────────────────────────

services:
  - type: web
    name: dpm101-chatbot
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "app:create_app()" --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_DEBUG
        value: "False"
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: CACHE_ENABLED
        value: "True"
      - key: RATE_LIMIT_ENABLED
        value: "True"
